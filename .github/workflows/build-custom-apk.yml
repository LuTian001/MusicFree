name: Build custom ARM64 APK

on:
  push:
    branches: [feature/skip-intro-outro]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: custom-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'LuTian001/MusicFree' && github.ref == 'refs/heads/feature/skip-intro-outro'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CUSTOM_APP_VERSION: 1.0.0-beta.4-skip.1
      CUSTOM_APP_VERSION_CODE: '400012'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install JavaScript dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Test playback rules and settings
        run: npm test -- --runInBand

      - name: Check TypeScript
        run: npx tsc --noEmit

      - name: Prepare custom version and ARM64 build
        run: |
          python3 <<'PY'
          import json
          import os
          import pathlib
          import re

          package_path = pathlib.Path('package.json')
          package = json.loads(package_path.read_text(encoding='utf-8'))
          package['version'] = os.environ['CUSTOM_APP_VERSION']
          package_path.write_text(json.dumps(package, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          app_gradle = pathlib.Path('android/app/build.gradle')
          source = app_gradle.read_text(encoding='utf-8')
          source, count = re.subn(r'def appVersionCode = \d+', 'def appVersionCode = ' + os.environ['CUSTOM_APP_VERSION_CODE'], source)
          assert count == 1, 'Expected exactly one versionCode definition'
          source = source.replace('universalApk true', 'universalApk false')
          source = source.replace('include "armeabi-v7a", "arm64-v8a", "x86", "x86_64"', 'include "arm64-v8a"')
          app_gradle.write_text(source, encoding='utf-8')

          wrapper_path = pathlib.Path('android/gradle/wrapper/gradle-wrapper.properties')
          wrapper = wrapper_path.read_text(encoding='utf-8')
          wrapper = re.sub(r'^distributionUrl=.*$', r'distributionUrl=https\://services.gradle.org/distributions/gradle-8.10.2-bin.zip', wrapper, flags=re.MULTILINE)
          wrapper = re.sub(r'^networkTimeout=.*$', 'networkTimeout=60000', wrapper, flags=re.MULTILINE)
          wrapper_path.write_text(wrapper, encoding='utf-8')
          PY

      - name: Install Android SDK components
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;26.1.10909125'

      - name: Configure private release signing
        env:
          CUSTOM_RELEASE_KEYSTORE_BASE64: ${{ secrets.CUSTOM_RELEASE_KEYSTORE_BASE64 }}
          CUSTOM_RELEASE_STORE_PASSWORD: ${{ secrets.CUSTOM_RELEASE_STORE_PASSWORD }}
          CUSTOM_RELEASE_KEY_ALIAS: ${{ secrets.CUSTOM_RELEASE_KEY_ALIAS }}
          CUSTOM_RELEASE_KEY_PASSWORD: ${{ secrets.CUSTOM_RELEASE_KEY_PASSWORD }}
        run: |
          python3 <<'PY'
          import base64
          import os
          import pathlib

          names = ['CUSTOM_RELEASE_KEYSTORE_BASE64', 'CUSTOM_RELEASE_STORE_PASSWORD', 'CUSTOM_RELEASE_KEY_ALIAS', 'CUSTOM_RELEASE_KEY_PASSWORD']
          if any(not os.environ.get(name) for name in names):
              raise SystemExit('Required custom release signing secrets are missing')
          keystore = pathlib.Path('android/app/custom-release.keystore')
          keystore.write_bytes(base64.b64decode(os.environ[names[0]], validate=True))
          properties = pathlib.Path('android/keystore.properties')
          properties.write_text('\n'.join([
              'RELEASE_STORE_FILE=custom-release.keystore',
              'RELEASE_STORE_PASSWORD=' + os.environ[names[1]],
              'RELEASE_KEY_ALIAS=' + os.environ[names[2]],
              'RELEASE_KEY_PASSWORD=' + os.environ[names[3]],
          ]) + '\n')
          keystore.chmod(0o600)
          properties.chmod(0o600)
          PY

      - name: Build signed ARM64 release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon --max-workers=2

      - name: Verify APK and generate checksum
        run: |
          APK=android/app/build/outputs/apk/release/app-arm64-v8a-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          mkdir -p custom-apk-output
          cp "$APK" "custom-apk-output/MusicFree-${CUSTOM_APP_VERSION}-arm64-v8a.apk"
          cd custom-apk-output
          sha256sum *.apk > SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: MusicFree-1.0.0-beta.4-skip.1-arm64-v8a
          path: custom-apk-output/*
          if-no-files-found: error
          retention-days: 30

      - name: Remove signing files
        if: always()
        run: rm -f android/app/custom-release.keystore android/keystore.properties
